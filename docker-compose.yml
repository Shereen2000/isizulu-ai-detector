services:
  trainer:
    build: .
    image: zulu-classifier:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - "./base model:/app/base model:ro"
      - "./datasets:/app/datasets:ro"
      - "./finetuned_classifier:/app/finetuned_classifier"
    command: python3 scripts/finetune.py
